services:
  - type: web
    name: naveen710-swing-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_RELEASE
        value: render-launch-2026-06-06-1
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: SCAN_WORKERS
        value: "4"
      - key: MID_SMALL_PARALLEL_WORKERS
        value: "10"
      - key: UNIVERSE_PROVIDER
        value: bundled_csv
      - key: ALLOW_DEMO_FALLBACK
        value: "0"
      - key: YAHOO_BATCH_SIZE
        value: "60"
      - key: MARKET_DATA_MEMORY_CACHE_SYMBOLS
        value: "48"
      - key: LIQUIDITY_FILTER_MIN_AVG_TRADED_VALUE_INR
        value: "50000000"
      - key: SCAN_RESULT_CACHE_TTL_MINUTES
        value: "15"
      - key: WEAK_MARKET_SECTOR_LIMIT
        value: "3"
      - key: EVENT_RISK_REVIEW_LIMIT
        value: "80"
      - key: EVENT_RISK_WINDOW_DAYS
        value: "7"
      - key: EVENT_RISK_EXCLUSION_TRADING_DAYS
        value: "5"
      - key: EVENT_RISK_HIGH_PENALTY_DAYS
        value: "3"
      - key: EVENT_RISK_POST_RESULT_COOLOFF_DAYS
        value: "2"
      - key: EVENT_DATA_CACHE_TTL_MINUTES
        value: "360"
      - key: DELIVERY_DATA_CACHE_TTL_MINUTES
        value: "1440"
      - key: DELIVERY_DATA_SESSIONS
        value: "10"
      - key: NSE_DELIVERY_ARCHIVE_BASE_URL
        value: https://archives.nseindia.com/archives/equities/mto
      - key: ASYNC_SCAN_UNIVERSE_THRESHOLD
        value: "200"
      - key: BENCHMARK_SYMBOL
        value: ^NSEI
      - key: BENCHMARK_SYMBOL_FALLBACKS
        value: NIFTYBEES.NS
      - key: BENCHMARK_NAME
        value: NIFTY 50
      - key: NSE_EQUITY_FALLBACK_CSV_URL
        value: https://archives.nseindia.com/content/equities/EQUITY_L.csv
      - key: CORS_ORIGINS
        value: https://naveen710-swing-web.onrender.com,http://localhost:3000

  - type: web
    name: naveen710-swing-web
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://naveen710-swing-api.onrender.com/api

  - type: worker
    name: naveen710-swing-alerts
    env: node
    rootDir: alerts
    buildCommand: npm install && npm run check
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SCANNER_API_BASE_URL
        value: https://naveen710-swing-api.onrender.com/api
      - key: SCANNER_WEB_URL
        value: https://naveen710-swing-web.onrender.com
      - key: SCAN_UNIVERSE
        value: nifty500
      - key: SCAN_MAX_RESULTS
        value: "5"
      - key: SCAN_MIN_PROBABILITY
        value: "0.55"
      - key: SCAN_MIN_RISK_REWARD
        value: "1.8"
      - key: SCAN_INVESTMENT_AMOUNT
        value: "100000"
      - key: ALERT_TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_EMAIL_ALERTS
        value: "1"
      - key: ENABLE_WHATSAPP_ALERTS
        value: "1"
      - key: ALERT_EMAIL_TO
        value: naveeneggadi@gmail.com,praveeneggadi044@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: CALLMEBOT_BASE_URL
        value: https://api.callmebot.com/whatsapp.php
      - key: SCAN_REQUEST_TIMEOUT_MS
        value: "120000"
      - key: SCAN_POLL_INTERVAL_MS
        value: "15000"
      - key: SCAN_POLL_TIMEOUT_MS
        value: "420000"
      - key: NSE_MARKET_HOLIDAYS
        value: ""
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false

  - type: cron
    name: naveen710-swing-daily-email
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "30 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.send_daily_scan_report
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: APP_RELEASE
        value: daily-email-2026-06-06-1
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: UNIVERSE_PROVIDER
        value: bundled_csv
      - key: ALLOW_DEMO_FALLBACK
        value: "0"
      - key: SCAN_WORKERS
        value: "4"
      - key: MID_SMALL_PARALLEL_WORKERS
        value: "10"
      - key: YAHOO_BATCH_SIZE
        value: "60"
      - key: MARKET_DATA_MEMORY_CACHE_SYMBOLS
        value: "48"
      - key: LIQUIDITY_FILTER_MIN_AVG_TRADED_VALUE_INR
        value: "50000000"
      - key: SCAN_RESULT_CACHE_TTL_MINUTES
        value: "15"
      - key: WEAK_MARKET_SECTOR_LIMIT
        value: "3"
      - key: EVENT_RISK_REVIEW_LIMIT
        value: "80"
      - key: EVENT_RISK_WINDOW_DAYS
        value: "7"
      - key: EVENT_RISK_EXCLUSION_TRADING_DAYS
        value: "5"
      - key: EVENT_RISK_HIGH_PENALTY_DAYS
        value: "3"
      - key: EVENT_RISK_POST_RESULT_COOLOFF_DAYS
        value: "2"
      - key: EVENT_DATA_CACHE_TTL_MINUTES
        value: "360"
      - key: DELIVERY_DATA_CACHE_TTL_MINUTES
        value: "1440"
      - key: DELIVERY_DATA_SESSIONS
        value: "10"
      - key: NSE_DELIVERY_ARCHIVE_BASE_URL
        value: https://archives.nseindia.com/archives/equities/mto
      - key: ASYNC_SCAN_UNIVERSE_THRESHOLD
        value: "999999"
      - key: BENCHMARK_SYMBOL
        value: ^NSEI
      - key: BENCHMARK_SYMBOL_FALLBACKS
        value: NIFTYBEES.NS
      - key: BENCHMARK_NAME
        value: NIFTY 50
      - key: NSE_EQUITY_FALLBACK_CSV_URL
        value: https://archives.nseindia.com/content/equities/EQUITY_L.csv
      - key: EMAIL_REPORT_ENABLED
        value: "1"
      - key: EMAIL_REPORT_TIMEZONE
        value: Asia/Kolkata
      - key: EMAIL_REPORT_MAX_RESULTS
        value: "12"
      - key: EMAIL_REPORT_MIN_PROBABILITY
        value: "0.55"
      - key: EMAIL_REPORT_MIN_RISK_REWARD
        value: "1.8"
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: EMAIL_SMTP_STARTTLS
        value: "1"
      - key: EMAIL_REPORT_RECIPIENTS
        value: naveeneggadi@gmail.com,praveeneggadi044@gmail.com
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
